<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ask The Owl</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      padding: 2em;
      max-width: 600px;
      margin: auto;
    }
    input, button {
      font-size: 1em;
      padding: 0.5em;
      margin-top: 1em;
      width: 100%;
    }
    #response {
      background: #fff;
      border-left: 4px solid #444;
      padding: 1em;
      margin-top: 1em;
      font-style: italic;
      color: #333;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🦉 Ask the Wise Owl</h1>
  <input type="text" id="prompt" placeholder="Type your question here..." />
  <button onclick="sendPrompt()">Ask</button>

  <div id="response"></div>

  <script>
    async function sendPrompt() {
      const prompt = document.getElementById('prompt').value;
      const responseDiv = document.getElementById('response');
      responseDiv.textContent = "The owl is thinking...";

      const res = await fetch('https://overjoyed-grizzled-tyrannosaurus.glitch.me/proxy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });

      const data = await res.json();
      responseDiv.textContent = data.response || "Hmm, the owl says nothing...";
    }
  </script>
</body>
</html>
