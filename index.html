<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure OpenAI Proxy</title>
</head>
<body>
  <h1>Ask Something</h1>
  <input type="text" id="prompt" placeholder="Enter your question" />
  <button onclick="sendPrompt()">Submit</button>

  <p><strong>Response:</strong> <span id="response"></span></p>

  <script>
    async function sendPrompt() {
      const prompt = document.getElementById('prompt').value;
      const responseDisplay = document.getElementById('response');

      const response = await fetch('https://overjoyed-grizzled-tyrannosaurus.glitch.me/proxy', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          prompt: prompt
        })
      });

      const data = await response.json();
      responseDisplay.textContent = data.response || "No response";
    }
  </script>
</body>
</html>
