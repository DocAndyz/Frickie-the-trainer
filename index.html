<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owl CCTV Chatbot</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .chat-container {
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .chat-header {
      background-color: #4f4fef;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 1.5em;
      position: relative;
    }

    .owl {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 60px;
    }

    .chat-box {
      height: 300px;
      overflow-y: auto;
      padding: 20px;
      border-bottom: 1px solid #ccc;
    }

    .chat-entry {
      margin-bottom: 10px;
    }

    .user-msg, .bot-msg {
      max-width: 80%;
      padding: 10px;
      border-radius: 12px;
      margin: 5px 0;
    }

    .user-msg {
      background-color: #d1e7dd;
      text-align: right;
      margin-left: auto;
    }

    .bot-msg {
      background-color: #f8d7da;
      text-align: left;
      margin-right: auto;
    }

    .chat-input {
      display: flex;
      padding: 15px;
      background-color: #f9f9f9;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 20px;
      background-color: #4f4fef;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Owl_icon.svg/1024px-Owl_icon.svg.png" alt="Owl Bot" class="owl">
      Owl CCTV Helper
    </div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Ask me about CCTV or CMD..." onkeydown="if(event.key === 'Enter') getResponse();">
      <button onclick="getResponse()">Ask</button>
    </div>
  </div>

  <script>
    const responses = {
      "how to check cctv camera status using cmd": "Use 'ping [Camera IP]' to check if it's online.",
      "how to find ip address of a cctv camera": "Check your router's device list or use 'arp -a' after connecting to the camera.",
      "how to trace the network path to the cctv camera": "Use 'tracert [Camera IP]'.",
      "how to test network connectivity to a cctv camera": "Ping the camera IP from CMD.",
      "how to find out which devices are connected to your network": "Use 'arp -a' or check the router admin page.",
      "how to check if a cctv camera is online": "Ping the IP or check camera LED indicators.",
      "how to change the ip address of a cctv camera in windows": "Use the camera's software or access its web UI.",
      "how to check for a firewall blocking cctv camera communication": "Use 'netstat -a' or disable the firewall temporarily for testing.",
      "how to check if a cctv camera is using a static ip": "Check camera settings in its web interface.",
      "how to check the status of ports in use for cctv dvr": "Use 'netstat -an | find \"8080\"'.",
      "how to configure an ip address for a cctv camera using cmd": "Use the camera tool or router DHCP reservation.",
      "how to configure router to allow cctv camera access remotely": "Port forward ports 80, 554 or as specified by your DVR.",
      "how to check cctv recording status via cmd": "CMD doesn't show recording status—check your DVR or camera interface.",
      "how to restart the cctv camera using cmd": "Use PoE switch reset or camera reboot option if supported.",
      "how to check for ip address conflicts on a network with cctv cameras": "Use 'arp -a' and compare to known IPs.",
      "how to view open ports on a cctv device using cmd": "Use 'netstat -an' while connected to the camera.",
      "how to check the bandwidth usage of cctv cameras on the network": "Use third-party tools or router interface.",
      "how to check the resolution of a cctv camera": "Look in the web UI under stream settings.",
      "how to delete cctv footage remotely": "Access DVR/NVR or cloud storage and delete from there.",
      "how to format a dvr’s hard drive using cmd": "Use DVR menu, not CMD, for drive formatting.",
      // Remaining 80 responses continue...
    };

    function displayMessage(message, sender) {
      const chatBox = document.getElementById('chat-box');
      const messageDiv = document.createElement('div');
      messageDiv.className = sender + '-msg chat-entry';
      messageDiv.innerText = message;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getResponse() {
      const userInput = document.getElementById('user-input');
      const query = userInput.value.toLowerCase().trim();
      if (query) {
        displayMessage(userInput.value, 'user');
        userInput.value = '';
        const reply = responses[query] || "Hoot hoot! I'm still learning that. Try rephrasing your CCTV or CMD question.";
        displayMessage(reply, 'bot');
      }
    }
  </script>
</body>
</html>
